<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geolocalização de Domínio ou IP</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f9;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin-top: 30px;
    }

    .map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      transition: background-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .input-group {
      max-width: 600px;
      margin: 0 auto;
    }

    #result {
      margin-top: 20px;
    }

    .alert {
      display: none;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .map-label {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      color: #343a40;
      font-weight: bold;
    }

    @media (max-width: 767px) {
      .col-md-6 {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center mb-4">Geolocalização de Domínio ou IP</h1>
    <div class="card p-4 mb-4">
      <form id="geolocationForm">
        <div class="input-group mb-3">
          <input type="text" id="domainInput" class="form-control" placeholder="Digite o domínio ou IP" aria-label="Domínio ou IP">
          <button class="btn btn-primary" type="submit">Buscar Localização</button>
        </div>
      </form>
      <div id="alert" class="alert alert-danger" role="alert"></div>
      <div id="result"></div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="map-label">Map</div>
        <div id="map1" class="map"></div>
      </div>
      <div class="col-md-6">
        <div class="map-label">Map</div>
        <div id="map2" class="map"></div>
      </div>
    </div>

    <footer class="text-center mt-4">
      <p>&copy; 2025 - Projeto de Geolocalização Por Domínio ou IP</p>
    </footer>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let map1, map2, marker1, marker2;

    async function getGeo() {
      const domain = document.getElementById('domainInput').value.trim();
      const alertBox = document.getElementById('alert');
      const resultDiv = document.getElementById('result');

      // Reset previous alerts and results
      alertBox.style.display = 'none';
      resultDiv.innerHTML = '';

      if (!domain) {
        alertBox.innerText = 'Por favor, insira um domínio ou IP válido.';
        alertBox.style.display = 'block';
        return;
      }

      try {
        const response = await fetch(`http://ip-api.com/json/${domain}`);
        const data = await response.json();

        if (data.status !== 'success') {
          alertBox.innerText = `Erro: ${data.message}`;
          alertBox.style.display = 'block';
          return;
        }

        const { lat, lon, city, country, isp, query, as } = data;

        // Split AS field into AS number and organization name
        let asNumber = '';
        let orgName = '';
        let bgpLink = '';
        if (as && as.match(/^AS\d+/)) {
          const match = as.match(/^(AS\d+)\s*(.*)$/);
          if (match) {
            asNumber = match[1];
            orgName = match[2] || '';
            bgpLink = `<a href="https://bgp.he.net/${asNumber}" target="_blank">https://bgp.he.net/${asNumber}</a>`;
          }
        }

        const googleMapsLink = `https://www.google.com/maps/place/${lat},${lon}`;
        const streetViewLink = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}&heading=-45&pitch=38&fov=80`;

        // Build result HTML
        let resultHTML = `
          <h5>Resultado da Geolocalização</h5>
          <p><strong>IP:</strong> ${query}</p>
          <p><strong>Cidade:</strong> ${city}</p>
          <p><strong>País:</strong> ${country}</p>
        `;
        if (asNumber) {
          resultHTML += `
            <p><strong>Organização:</strong> ${orgName || 'Não disponível'}</p>
            <p><strong>Número AS:</strong> ${asNumber}</p>
            <p><strong>Detalhes AS:</strong> ${bgpLink}</p>
          `;
        }
        resultHTML += `
          <p><strong>Latitude:</strong> ${lat}</p>
          <p><strong>Longitude:</strong> ${lon}</p>
          <p><strong>Geolocalização:</strong> ${lat},${lon}</p>
          <p><strong>Google Maps:</strong> <a href="${googleMapsLink}" target="_blank">${googleMapsLink}</a></p>
          <p><strong>Google Street View:</strong> <a href="${streetViewLink}" target="_blank">${streetViewLink}</a></p>
        `;
        resultDiv.innerHTML = resultHTML;

        // Build popup content
        let popupContent = `<b>${city}, ${country}</b><br>IP: ${query}`;
        if (asNumber) {
          popupContent += `<br>Organização: ${orgName || 'Não disponível'}<br>AS: ${asNumber}<br><a href="https://bgp.he.net/${asNumber}" target="_blank">Detalhes AS</a>`;
        }

        // Initialize or update maps
        if (!map1) {
          map1 = L.map('map1').setView([lat, lon], 10);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }).addTo(map1);
          marker1 = L.marker([lat, lon]).addTo(map1)
            .bindPopup(popupContent).openPopup();
        } else {
          map1.setView([lat, lon], 10);
          if (marker1) map1.removeLayer(marker1);
          marker1 = L.marker([lat, lon]).addTo(map1)
            .bindPopup(popupContent).openPopup();
        }

        if (!map2) {
          map2 = L.map('map2').setView([lat, lon], 10);
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '© <a href="https://www.google.com/maps">Google Maps</a>'
          }).addTo(map2);
          marker2 = L.marker([lat, lon]).addTo(map2)
            .bindPopup(popupContent).openPopup();
        } else {
          map2.setView([lat, lon], 10);
          if (marker2) map2.removeLayer(marker2);
          marker2 = L.marker([lat, lon]).addTo(map2)
            .bindPopup(popupContent).openPopup();
        }
      } catch (error) {
        console.error('Erro na requisição:', error);
        alertBox.innerText = 'Erro ao buscar dados. Verifique sua conexão ou o domínio/IP informado.';
        alertBox.style.display = 'block';
      }
    }

    // Attach form submit event
    document.getElementById('geolocationForm').addEventListener('submit', function (e) {
      e.preventDefault();
      getGeo();
    });
  </script>
</body>
</html>
