
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websites Úteis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px auto; /* Adiciona margem no topo e centraliza horizontalmente */
            max-width: 860px; /* Limita a largura do container */
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 800px;
        }
        .button {
            background-color: #007BFF;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Websites Úteis</h1>
        <div class="button-grid">
            <a href="https://googledorks.neocities.org/Linux.Comando" class="button" target="_blank">Comandos Linux</a>
            <a href="https://agente-deep-web.comunidades.net" class="button" target="_blank">Agente Deep Web</a>
            <a href="https://github.com/anderson84PROGETOS/anderson84PROGETOS" class="button" target="_blank">Meu Github</a>
            <a href="https://googledorks.neocities.org/201OSINTFramework" class="button" target="_blank">201 OSINT Framework</a>
            <a href="https://googledorks.neocities.org/GoogleDorksExplorer" class="button" target="_blank">Google Dorks Explorer</a>
            <a href="https://googledorks.neocities.org/ComandosdoKaliLinux" class="button" target="_blank">Comandos Kali Linux</a>
            <a href="https://googledorks.neocities.org/Lista_de_Google_Dorks" class="button" target="_blank">Lista de Google Dorks</a>
            <a href="https://googledorks.neocities.org/nmap" class="button" target="_blank">Nmap</a>
            <a href="https://googledorks.neocities.org/QR.Code.Tool" class="button" target="_blank">QR Code Tool</a>
            <a href="https://googledorks.neocities.org/SOC" class="button" target="_blank">SOC</a>
            <a href="https://googledorks.neocities.org/LinksUteis" class="button" target="_blank">Links Úteis</a>
            <a href="https://googledorks.neocities.org/GuiadeComandosLinuxeWindows" class="button" target="_blank">Guia de Comandos Linux e Windows</a>       
            <a href="https://googledorks.neocities.org/Hacker.Investigador.OSINT" class="button" target="_blank">Hacker.Investigador.OSINT</a>            
            <a href="https://www.shodan.io" class="button" target="_blank">shodan</a>            
            <a href="https://urlscan.io" class="button" target="_blank">urlscan</a>
                       
        </div>
    </div>
</body>
</html>
