        async function findSubdomains() {
            const domain = document.getElementById('domainInput').value.trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p id="searching">Buscando...</p>';

            if (!domain) {
                resultsDiv.innerHTML = '<p>Por favor, insira um domínio válido.</p>';
                return;
            }

            resultsDiv.innerHTML = ''; // Remove o "Buscando..." antes de começar

            // Testa cada subdomínio, priorizando HTTPS
            for (const sub of commonSubdomains) {
                const httpsUrl = `https://${sub}.${domain}`;
                const httpUrl = `http://${sub}.${domain}`;
                const resultElement = document.createElement('div');
                resultElement.classList.add('result');
                resultElement.textContent = `Testando ${httpsUrl}...`;
                resultsDiv.appendChild(resultElement);

                try {
                    // Tenta HTTPS primeiro
                    const httpsResponse = await fetch(httpsUrl, {
                        method: 'HEAD',
                        mode: 'no-cors'
                    });
                    resultElement.style.display = 'none'; // Faz o "Testando..." sumir
                    resultElement.textContent = `${httpsUrl}`; // Define o texto final
                    resultElement.classList.add('active');
                    resultElement.style.display = 'block'; // Faz reaparecer com o resultado
                } catch (httpsError) {
                    // Se HTTPS falhar, tenta HTTP
                    try {
                        const httpResponse = await fetch(httpUrl, {
                            method: 'HEAD',
                            mode: 'no-cors'
                        });
                        resultElement.style.display = 'none'; // Faz o "Testando..." sumir
                        resultElement.textContent = `${httpUrl}`; // Define o texto final
                        resultElement.classList.add('active');
                        resultElement.style.display = 'block'; // Faz reaparecer com o resultado
                    } catch (httpError) {
                        // Remove completamente o elemento do DOM se não for encontrado
                        resultsDiv.removeChild(resultElement);
                    }
                }
            }

            // Verifica e exibe a quantidade de subdomínios encontrados
            const activeResults = resultsDiv.getElementsByClassName('active');
            const summaryElement = document.createElement('div');
            summaryElement.id = 'summary';
            if (activeResults.length === 0) {
                summaryElement.textContent = 'Nenhum subdomínio ativo encontrado.';
            } else {
                summaryElement.textContent = `Total de subdomínios Encontrados: ${activeResults.length}`;
            }
            resultsDiv.appendChild(summaryElement);
        }
