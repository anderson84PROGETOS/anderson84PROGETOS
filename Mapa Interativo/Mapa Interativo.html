<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
            font-size: 2.5em;
        }
        #map {
            height: 637px;
            width: 90%;
            margin: 20px auto;
            border: 2px solid #ffffff;
        }
        .controls {
            margin: 10px auto;
            width: 93%;
            text-align: left;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #cccccc;
        }
        .layer-info {
            margin: 5px 10px;
            font-size: 1.1em;
        }
        #search-input {
            padding: 10px;
            margin: 5px;
            width: 250px;
            background-color: #ffffff;
            color: #000000;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Mapa Interativo</h1>
    <div class="controls">
        <button onclick="addMarker()">Adicionar Marcador</button>
        <button onclick="removeMarkers()">Remover Marcadores</button>
        <button onclick="changeLayer(-1)">-</button>
        <span class="layer-info">Camada: <span id="layer-counter">1</span>/3</span>
        <button onclick="changeLayer(1)">+</button>
        <button onclick="openStreetView()">Abrir Street View</button>
        <input type="text" id="search-input" placeholder="Digite cidade, endereço, CEP ou telefone">
        <button onclick="searchLocation()">Pesquisar Localização</button>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar o mapa centrado no São Paulo (-23.5475,-46.6361)
        var map = L.map('map', { layers: [] }).setView([-23.5475,-46.6361], 14);       

        // Definir camadas
        var layers = [
            {
                name: 'osm',
                layer: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                })
            },
            {
                name: 'satellite',
                layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                })
            },
            {
                name: 'terrain',
                layer: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    attribution: 'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: © <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
                })
            }
        ];

        // Adicionar camada padrão (OSM) inicialmente
        layers[0].layer.addTo(map);

        // Variável para controlar o índice da camada atual
        var currentLayerIndex = 0;

        // Array para armazenar marcadores
        var markers = [];

        // Mapeamento de DDD para cidade/estado
        const dddMapping = {
            '11': 'São Paulo, SP',
            '12': 'São José dos Campos, SP',
            '13': 'Santos, SP',
            '14': 'Bauru, SP',
            '15': 'Sorocaba, SP',
            '16': 'Ribeirão Preto, SP',
            '17': 'São José do Rio Preto, SP',
            '18': 'Presidente Prudente, SP',
            '19': 'Campinas, SP',
            '21': 'Rio de Janeiro, RJ',
            '22': 'Campos dos Goytacazes, RJ',
            '24': 'Volta Redonda, RJ',
            '27': 'Vila Velha, ES',
            '28': 'Cachoeiro de Itapemirim, ES',
            '31': 'Belo Horizonte, MG',
            '32': 'Juiz de Fora, MG',
            '33': 'Governador Valadares, MG',
            '34': 'Uberlândia, MG',
            '35': 'Poços de Caldas, MG',
            '37': 'Divinópolis, MG',
            '38': 'Montes Claros, MG',
            '41': 'Curitiba, PR',
            '42': 'Ponta Grossa, PR',
            '43': 'Londrina, PR',
            '44': 'Maringá, PR',
            '45': 'Foz do Iguaçu, PR',
            '46': 'Pato Branco, PR',
            '47': 'Joinville, SC',
            '48': 'Florianópolis, SC',
            '49': 'Chapecó, SC',
            '51': 'Porto Alegre, RS',
            '53': 'Pelotas, RS',
            '54': 'Caxias do Sul, RS',
            '55': 'Santa Maria, RS',
            '61': 'Brasília, DF',
            '62': 'Goiânia, GO',
            '63': 'Palmas, TO',
            '64': 'Rio Verde, GO',
            '65': 'Cuiabá, MT',
            '66': 'Rondonópolis, MT',
            '67': 'Campo Grande, MS',
            '68': 'Rio Branco, AC',
            '69': 'Porto Velho, RO',
            '71': 'Salvador, BA',
            '73': 'Ilhéus, BA',
            '74': 'Juazeiro, BA',
            '75': 'Feira de Santana, BA',
            '77': 'Barreiras, BA',
            '79': 'Aracaju, SE',
            '81': 'Recife, PE',
            '82': 'Maceió, AL',
            '83': 'João Pessoa, PB',
            '84': 'Natal, RN',
            '85': 'Fortaleza, CE',
            '86': 'Teresina, PI',
            '87': 'Petrolina, PE',
            '88': 'Juazeiro do Norte, CE',
            '89': 'Picos, PI',
            '91': 'Belém, PA',
            '92': 'Manaus, AM',
            '93': 'Santarém, PA',
            '94': 'Marabá, PA',
            '95': 'Boa Vista, RR',
            '96': 'Macapá, AP',
            '97': 'Coari, AM',
            '98': 'São Luís, MA',
            '99': 'Imperatriz, MA'
        };

        // Função para adicionar marcador com duplo clique
        function addMarker() {
            map.off('click');
            map.on('dblclick', function(e) {
                var marker = L.marker(e.latlng).addTo(map)
                    .bindPopup(`<b>Localização</b><br>Lat: ${e.latlng.lat}<br>Lng: ${e.latlng.lng}<br><button onclick="saveMarker(this)">Salvar</button>`)
                    .openPopup();
                markers.push(marker);
            });
        }

        // Função para salvar marcador
        function saveMarker(button) {
            var popup = button.parentElement;
            popup.innerHTML = `<b>Localização Salva</b><br>Lat: ${popup.querySelector('br').nextSibling.textContent.split(': ')[1]}<br>Lng: ${popup.querySelector('br').nextSibling.nextSibling.textContent.split(': ')[1]}`;
        }

        // Função para remover todos os marcadores
        function removeMarkers() {
            markers.forEach(function(marker) {
                map.removeLayer(marker);
            });
            markers = [];
        }

        // Função para mudar camadas
        function changeLayer(direction) {
            map.eachLayer(function(layer) {
                // Remover apenas as camadas de tiles, preservando marcadores
                if (layers.some(l => l.layer === layer)) {
                    map.removeLayer(layer);
                }
            });
            currentLayerIndex = (currentLayerIndex + direction + layers.length) % layers.length;
            layers[currentLayerIndex].layer.addTo(map);
            // Re-adicionar todos os marcadores
            markers.forEach(function(marker) {
                marker.addTo(map);
            });
            document.getElementById('layer-counter').textContent = currentLayerIndex + 1;
        }

        // Função para pesquisar localização
        async function searchLocation() {
            let query = document.getElementById('search-input').value.trim();
            if (!query) {
                alert('Por favor, insira uma cidade, endereço, CEP ou telefone!');
                return;
            }

            let markerLabel = query; // Guardar a query original para o popup

            // Verificar se a entrada é um número de telefone (ex: +5511915058723 ou 11915058723)
            const phonePattern = /^\+?55(\d{2})\d{8,9}$/;
            if (phonePattern.test(query.replace(/\s/g, ''))) {
                // Extrair o DDD
                const match = query.replace(/\s/g, '').match(/^\+?55(\d{2})/);
                const ddd = match[1];
                if (dddMapping[ddd]) {
                    query = dddMapping[ddd];
                } else {
                    alert('DDD não encontrado!');
                    return;
                }
            }
            // Verificar se a entrada é um CEP (8 dígitos, com ou sem hífen)
            else if (/^\d{5}-?\d{3}$/.test(query)) {
                // Remover hífen do CEP, se presente
                query = query.replace('-', '');
                try {
                    // Consultar a API ViaCEP para obter o endereço
                    const cepResponse = await fetch(`https://viacep.com.br/ws/${query}/json/`);
                    const cepData = await cepResponse.json();
                    if (cepData.erro) {
                        alert('CEP não encontrado!');
                        return;
                    }
                    // Construir a query com base nos dados retornados
                    query = `${cepData.logradouro}, ${cepData.bairro}, ${cepData.localidade}, ${cepData.uf}, Brasil`;
                } catch (error) {
                    alert('Erro ao buscar CEP. Tente novamente.');
                    console.error(error);
                    return;
                }
            }

            // Consultar Nominatim para geocodificar a query (endereço, cidade ou resultado do DDD/CEP)
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
                const data = await response.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 14);
                    // Adicionar marcador com o nome da localização
                    const marker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${markerLabel}</b><br>Lat: ${lat}<br>Lng: ${lon}<br><button onclick="saveMarker(this)">Salvar</button>`)
                        .openPopup();
                    markers.push(marker);
                } else {
                    alert('Localização não encontrada!');
                }
            } catch (error) {
                alert('Erro ao buscar localização. Tente novamente.');
                console.error(error);
            }
        }

        // Função para abrir Street View
        function openStreetView() {
            if (markers.length > 0) {
                var lastMarker = markers[markers.length - 1].getLatLng();
                var streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lastMarker.lat},${lastMarker.lng}&heading=90&pitch=0`;
                window.open(streetViewUrl, '_blank');
            } else {
                alert('Adicione um marcador primeiro!');
            }
        }
    </script>
</body>
</html>
