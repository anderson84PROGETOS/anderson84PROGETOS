<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geolocalização de Domínio ou IP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Geolocalização de Domínio ou IP</h1>
    <form id="geolocationForm" class="mb-4">
      <div class="input-group">
        <input type="text" class="form-control" id="domainInput" placeholder="Digite o Domínio ou IP" required>
        <button class="btn btn-primary" type="submit">Buscar Localização</button>
      </div>
    </form>
    <div id="alert" class="alert alert-danger" role="alert" style="display: none;"></div>
    <div id="result" class="card p-3 mb-4"></div>
    <div class="row">
      <div class="col-md-6">
        <h3 class="map-label">Map</h3>
        <div id="map1" class="map"></div>
      </div>
      <div class="col-md-6">
        <h3 class="map-label">Map</h3>
        <div id="map2" class="map"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="script.js"></script>
  <footer class="footer mt-5 py-3 bg-dark text-white text-center">
  <div class="container">
    <span>© 2025 - Projeto de Geolocalização Por Dominio ou IP</span>
  </div>
</footer>
</body>
</html>
