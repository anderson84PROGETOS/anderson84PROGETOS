<!DOCTYPE html>
<html>
  <head>
    <title>Dark Mode</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background: #f9f9f9;
      }
      button {
        display: block;
        margin: 5px 0;
        padding: 10px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
      #dark {
        background: #121212;
        color: white;
      }
      #normal {
        background: #eee;
        color: black;
      }
    </style>
  </head>
  <body>
    <button id="dark">Ativar Dark</button>
    <button id="normal">Desativar Dark</button>
    <script src="popup.js"></script>
  </body>
</html>
