<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coletar URL Imagens</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      width: 772px; 
      padding: 10px; 
    }
    button { 
      margin: 5px 0; 
      padding: 10px; 
      width: 100%; 
      background-color: #28a745; /* Verde */
      color: white;              /* Texto branco */
      border: none;              /* Remove borda padrão */
      border-radius: 5px;        /* Cantos arredondados */
      cursor: pointer;           /* Mãozinha no hover */
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838; /* Verde mais escuro no hover */
    }
    textarea { 
      width: 100%; 
      height: 350px; 
      margin-top: 10px; 
    }
    #contador { 
      margin-top: 5px; 
      font-weight: bold; 
      font-size: 16px;  /* Fonte ajustada */
    }
  </style>
</head>
<body>
  <h2>Imagens da Página</h2>
  <button id="coletar">Coletar URL Imagens</button>
  <button id="salvar">Salvar .txt</button>
  <div id="contador">URL Encontradas: 0</div>
  <textarea id="resultado" readonly></textarea>

  <script src="popup.js"></script>
</body>
</html>
