<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Photos e Perfil Instagram Baixar ZIP</title>
  <style>
    body { font-family: Arial, sans-serif; width: 420px; padding: 10px; }
    #salvarLinks { background-color: #ffc107; color: #000; }

    h2 { margin: 0 0 8px; }
    button { 
      padding: 10px; 
      font-size: 14px; 
      margin: 6px 0; 
      width: 100%; 
      cursor: pointer; 
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover { opacity: 0.85; }

    #listar { background-color: #007bff; }
    #listarPerfil { background-color: #17a2b8; }
    #baixarPerfil { background-color: #6f42c1; }
    #baixarSelecionadas { background-color: #28a745; }
    #baixarPerfilDireto { background-color: #fd7e14; }
    #desmarcarTodas { background-color: #dc3545; }

    #status { margin-top: 8px; font-weight: bold; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; }

    .thumb { 
      width: 100%; 
      height: 140px;        
      object-fit: contain;  
      border-radius: 4px; 
      background: #f0f0f0;  
    }

    .url { font-size: 10px; word-break: break-all; margin-top: 4px; text-align: center; }

    .mini-download {
      margin-top: 4px;
      padding: 4px 6px;
      font-size: 11px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
    }
    .mini-download:hover { opacity: 0.85; }

    .row { display: flex; gap: 8px; }
    .row > button { flex: 1; }
  </style>
</head>
<body>
  <h2>Photos e Perfil Instagram Baixar ZIP</h2>

  <div class="row">
    <button id="listar">Listar todas as imagens e perfil Instagram</button>
  </div>

  <div class="row">
    <button id="listarPerfil">Listar imagens desta página</button>  
  </div>

  <div class="row">
    <button id="baixarSelecionadas">Baixar Selecionadas ZIP</button>   
  </div>

  <div class="row">    
    <button id="desmarcarTodas">Desmarcar Todas</button>
  </div>

  <div class="row">
    <button id="salvarLinks">Salvar URL marcadas</button>
  </div>

  <div id="status">Pronto.</div>
  <div id="grid"></div>

  <!-- Carregar JSZip antes do popup.js -->
  <script src="js/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
