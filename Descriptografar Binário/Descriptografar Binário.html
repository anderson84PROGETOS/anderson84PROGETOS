<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descriptografar Binário Texto e Imagens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 600px;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      min-height: 850px;
      margin: 0 auto;
    }
    #imageCanvas {
      max-width: 400px;
      max-height: 400px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold text-center mb-4">Descriptografar Binário Texto e Imagens</h1>

    <!-- Painel de Botões -->
    <div class="flex flex-wrap gap-4 mb-4 justify-center">
      <label class="bg-[#03fc24] hover:bg-green-600 text-black px-6 py-2 rounded cursor-pointer font-semibold">
        Abrir Arquivo Texto ou Binário na Imagem
        <input type="file" id="fileInput" accept=".txt,image/png,image/jpeg,image/bmp" class="hidden" onchange="handleFileUpload(event)">
      </label>
      <label class="bg-[#c5f542] hover:bg-yellow-400 text-black px-4 py-2 rounded cursor-pointer font-semibold">
        Abrir Imagem
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/bmp,image/tiff,image/webp" class="hidden" onchange="handleImageUpload(event)">
      </label>
      <button class="bg-[#fcd103] hover:bg-yellow-500 text-black px-4 py-2 rounded font-semibold" onclick="saveText()">
        Salvar Texto
      </button>
      <button class="bg-[#03f0fc] hover:bg-cyan-600 text-black px-4 py-2 rounded font-semibold" onclick="hideTextInImage()">
        Ocultar Texto em Imagem e Salvar
      </button>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex flex-col md:flex-row gap-4">
      <!-- Exibição da Imagem -->
      <div class="bg-white p-12 rounded shadow w-full md:w-[500px]">
        <h2 class="text-lg font-semibold mb-2">Imagem</h2>
        <canvas id="imageCanvas" class="border"></canvas>
      </div>
      <!-- Saída de Texto -->
      <div class="bg-white p-4 rounded shadow w-full md:flex-1">
        <h2 class="text-lg font-semibold mb-2">Saída</h2>
        <textarea id="outputText" class="w-full h-96 border rounded p-2 resize-none font-mono text-base" placeholder="Texto decodificado aparecerá aqui..."></textarea>
      </div>
    </div>

    <!-- Barra de Status -->
    <div class="mt-4 text-gray-700" id="status">Pronto.</div>
  </div>

  <script>
    let currentImage = null;
    let inputContent = '';

    // Converte binário para texto
    function binaryToText(bstr) {
      try {
        const bits = bstr.replace(/[^01]/g, '');
        if (bits.length % 8 !== 0) {
          throw new Error(`Quantidade de bits (${bits.length}) não é múltipla de 8.`);
        }
        let chars = [];
        for (let i = 0; i < bits.length; i += 8) {
          chars.push(String.fromCharCode(parseInt(bits.slice(i, i + 8), 2)));
        }
        return chars.join('');
      } catch (e) {
        alert(`Erro ao decodificar binário: ${e.message}`);
        return '';
      }
    }

    // Extração de bits LSB
    function extractLSBBits(image) {
      const canvas = document.createElement('canvas');
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let bits = [];
      for (let i = 2; i < imageData.length; i += 4) {
        bits.push(imageData[i] & 1); // LSB do canal azul
      }
      return bits;
    }

    function bitsToBytes(bits, msbFirst = true, stopOnTerminator = true) {
      let bytesList = [];
      let zeroRun = 0;
      for (let i = 0; i < bits.length; i += 8) {
        let byte = 0;
        for (let j = 0; j < 8; j++) {
          const idx = i + j;
          const bit = idx < bits.length ? bits[idx] : 0;
          if (msbFirst) {
            byte = (byte << 1) | (bit & 1);
          } else {
            byte |= ((bit & 1) << j);
          }
        }
        bytesList.push(byte);
        if (stopOnTerminator) {
          if (byte === 0) {
            zeroRun++;
          } else {
            zeroRun = 0;
          }
          if (zeroRun >= 8) {
            return bytesList.slice(0, -8);
          }
        }
      }
      return bytesList;
    }

    function filterPrintable(text) {
      return text.split('').filter(ch => /[\x20-\x7E]/.test(ch)).join('');
    }

    function decodeTextLSB(image, maxBytes = 390) {    
    try {
        const bits = extractLSBBits(image); // Extrai os bits LSB da imagem
        const bytesMSB = bitsToBytes(bits, true); // Converte bits para bytes (MSB first)
        const txtMSB = filterPrintable(String.fromCharCode(...bytesMSB)); // Converte bytes para texto imprimível
        const bytesLSB = bitsToBytes(bits, false); // Converte bits para bytes (LSB first)
        const txtLSB = filterPrintable(String.fromCharCode(...bytesLSB)); // Converte bytes para texto imprimível

        // Escolhe o texto mais longo
        const result = txtLSB.length > txtMSB.length ? txtLSB : txtMSB;
        if (result) {
            return result; // Retorna texto imprimível, se disponível
        }

        // Se não houver texto imprimível, converte bytes para hexadecimal formatado
        const hexString = bytesMSB
            .map(byte => byte.toString(16).padStart(2, '0').toUpperCase())
            .join(' '); // Adiciona espaços entre bytes
        return hexString.slice(0, maxBytes * 3); // Limita a maxBytes (cada byte = 2 chars + 1 espaço)
    } catch (e) {
        try {
            const bits = extractLSBBits(image);
            const bytes = bitsToBytes(bits, true); // Tenta MSB first
            const hexString = bytes
                .map(byte => byte.toString(16).padStart(2, '0').toUpperCase())
                .join(' ');
            return hexString.slice(0, maxBytes * 3); // Limita a maxBytes
        } catch {
            return "00"; // Último recurso: string hexadecimal não vazia
        }
    }
}

    function textToBits(text) {
      const data = new TextEncoder().encode(text);
      const terminator = new Array(8).fill(0); // 8 bytes nulos
      const bits = [];
      for (let byte of [...data, ...terminator]) {
        for (let i = 7; i >= 0; i--) {
          bits.push((byte >> i) & 1);
        }
      }
      return bits;
    }

    function filterPrintable(text) {
      return text.split('').filter(ch => /[\x20-\x7E]|\n/.test(ch)).join('');
    }

    function encodeTextInImage(image, text) {
      const canvas = document.createElement('canvas');
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const bits = textToBits(text);
      if (bits.length > (canvas.width * canvas.height)) {
        throw new Error('Texto muito grande para caber nesta imagem!');
      }
      let bitIdx = 0;
      for (let i = 2; i < data.length; i += 4) {
        if (bitIdx < bits.length) {
          data[i] = (data[i] & ~1) | bits[bitIdx];
          bitIdx++;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      return canvas;
    }

    // Manipulação de arquivos
    async function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const outputText = document.getElementById('outputText');
      const status = document.getElementById('status');
      try {
        if (file.type && file.type.startsWith('image/')) {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          await new Promise((resolve, reject) => {
            img.onload = () => resolve();
            img.onerror = () => reject(new Error('Falha ao carregar imagem.'));
          });

          // Exibe imagem no canvas principal
          const canvas = document.getElementById('imageCanvas');
          const ctx = canvas.getContext('2d');
          const maxSize = 400;
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, width, height);

          // Extrai mensagem binária
          const tmpCanvas = document.createElement('canvas');
          tmpCanvas.width = img.width;
          tmpCanvas.height = img.height;
          const ctxTmp = tmpCanvas.getContext('2d');
          ctxTmp.drawImage(img, 0, 0);
          const data = ctxTmp.getImageData(0, 0, img.width, img.height).data;

          let binMsg = '';
          for (let i = 0; i < data.length; i += 4) {
            for (let j = 0; j < 3; j++) {
              binMsg += (data[i + j] & 1).toString();
            }
          }
          binMsg = binMsg.slice(0, binMsg.length - (binMsg.length % 8));

          inputContent = binMsg;
          outputText.value = binaryToText(binMsg);
          status.textContent = `Imagem carregada e mensagem decodificada: ${file.name}`;
        } else {
          // Se for arquivo de texto
          const reader = new FileReader();
          reader.onload = function (e) {
            inputContent = e.target.result;
            outputText.value = binaryToText(inputContent);
            status.textContent = `Arquivo de texto carregado: ${file.name}`;
          };
          reader.readAsText(file);
        }
      } catch (e) {
        alert('Erro ao abrir arquivo: ' + e.message);
      }
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(resolve => img.onload = resolve);
        currentImage = img;
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const maxSize = 400;
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxSize) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          }
        } else {
          if (height > maxSize) {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        const text = decodeTextLSB(img);
        document.getElementById('outputText').value = text;
        document.getElementById('status').textContent = `Imagem carregada: ${file.name}`;
      } catch (e) {
        alert(`Não foi possível processar a imagem: ${e.message}`);
      }
    }

    function saveText() {
      const text = document.getElementById('outputText').value.trim();
      if (!text) {
        alert('Nenhum texto para salvar!');
        return;
      }
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'output.txt';
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('status').textContent = 'Texto salvo: output.txt';
    }

    function hideTextInImage() {
      if (!currentImage) {
        alert('Abra uma imagem primeiro!');
        return;
      }
      const text = document.getElementById('outputText').value.trim();
      if (!text) {
        alert('Digite algum texto na caixa antes de ocultar!');
        return;
      }
      try {
        const canvas = encodeTextInImage(currentImage, text);
        canvas.toBlob(function (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'encoded_image.png';
          a.click();
          URL.revokeObjectURL(url);
          document.getElementById('status').textContent = 'Imagem com texto oculto salva: encoded_image.png';
        }, 'image/png');
      } catch (e) {
        alert(`Falha ao ocultar texto: ${e.message}`);
      }
    }
  </script>
</body>
</html>
