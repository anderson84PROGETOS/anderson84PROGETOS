<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lora:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;700&family=Raleway:wght@400;700&family=Merriweather:wght@400;700&family=Cinzel:wght@400;700&family=Pacifico&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .editor {
            flex: 1;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            min-height: 600px;
        }
        .controls {
            width: 300px;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .controls label {
            display: block;
            margin: 10px 0 5px;
        }
        .controls input, .controls select, .controls button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        .canvas {
            width: 595px;
            height: 842px;
            border: 1px dashed #000;
            position: relative;
            overflow: hidden;
            background: var(--canvas-bg-color, #fff);
        }
        .text-element, .image-container {
            position: absolute;
            cursor: move;
            user-select: none;
        }
        .text-element {
            font-family: inherit;
        }
        .text-element[contenteditable="true"]:focus {
            cursor: text;
            border: 1px dashed #007bff;
            padding: 2px;
            outline: none;
        }
        .text-element.selected {
            border: 2px solid #007bff;
        }
        .image-container {
            border: 1px solid #000;
            resize: both;
            overflow: auto;
        }
        .image-container.confirmed {
            border: 2px solid #28a745;
        }
        .image-container.selected {
            border: 2px solid #007bff;
        }
        .image-element {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .page-controls {
            margin-top: 10px;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .delete-button {
            background: #dc3545;
        }
        .delete-button:hover {
            background: #c82333;
        }
        .unconfirm-button {
            background: #007bff;
        }
        .unconfirm-button:hover {
            background: #0056b3;
        }
        .resize-handle {
            width: 10px;
            height: 10px;            
            position: absolute;
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
        }
        .hidden-canvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 595px;
            height: 842px;
            background: var(--canvas-bg-color, #fff);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor">
            <h2>Criador de PDF</h2>
            <div id="canvas" class="canvas" contenteditable="false"></div>
            <div class="page-controls">
                <button onclick="addPage()">Adicionar Página</button>
                <button onclick="prevPage()">Página Anterior</button>
                <button onclick="nextPage()">Próxima Página</button>
                <span id="page-indicator">Página 1</span>
            </div>
        </div>
        <div class="controls">
            <h3>Controles</h3>
            <label>Adicionar Texto</label>
            <input type="text" id="textInput" placeholder="Digite o texto">
            <label>Cor do Texto</label>
            <input type="color" id="textColor" value="#000000">
            <label>Tamanho da Fonte</label>
            <input type="number" id="fontSize" value="16" min="8" max="72">
            <label>Fonte</label>
            <select id="fontFamily">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Garamond">Garamond</option>
                <option value="Palatino Linotype">Palatino Linotype</option>
                <option value="Roboto">Roboto</option>
                <option value="Lora">Lora</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Poppins">Poppins</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Raleway">Raleway</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Cinzel">Cinzel</option>
                <option value="Pacifico">Pacifico</option>
                <option value="Dancing Script">Dancing Script</option>
                <option value="Great Vibes">Great Vibes</option>
                <option value="Lato">Lato</option>
            </select>
            <label>Posição</label>
            <select id="position">
                <option value="top-left">Canto Superior Esquerdo</option>
                <option value="center">Centro</option>
                <option value="bottom-right">Canto Inferior Direito</option>
            </select>
            <button onclick="confirmText()">Confirmar Texto</button>
            <button class="delete-button" onclick="deleteText()">Excluir Texto</button>
            <label>Adicionar Imagem</label>
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="confirmImage()">Confirmar Imagem</button>
            <button class="delete-button" onclick="deleteImage()">Excluir Imagem</button>
            <label>Tamanho da Imagem (px)</label>
            <input type="range" id="imageSize" min="100" max="595" value="100" onchange="resizeSelectedImage()">
            <label>Cor de Fundo do PDF</label>
            <input type="color" id="bgColor" value="#ffffff">
            <button onclick="confirmBackgroundColor()">Confirmar Cor de Fundo</button>
            <button class="delete-button" onclick="deletePage()">Excluir Página</button>
            <button onclick="generatePDF()">Gerar PDF</button>
        </div>
    </div>

    <script>
        let selectedElement = null;
        let pages = [{ elements: [], canvas: document.getElementById('canvas') }];
        let currentPage = 0;
        let confirmedBgColor = '#ffffff';
        const canvasWidth = 595;
        const canvasHeight = 842;

        function confirmBackgroundColor() {
            confirmedBgColor = document.getElementById('bgColor').value;
            pages.forEach(page => {
                page.canvas.style.setProperty('--canvas-bg-color', confirmedBgColor);
            });
        }

        function getPositionCoordinates(position, elementWidth = 0, elementHeight = 0) {
            switch (position) {
                case 'top-left':
                    return { left: 10, top: 10 };
                case 'center':
                    return {
                        left: (canvasWidth - elementWidth) / 2,
                        top: (canvasHeight - elementHeight) / 2
                    };
                case 'bottom-right':
                    return {
                        left: canvasWidth - elementWidth - 10,
                        top: canvasHeight - elementHeight - 10
                    };
                default:
                    return { left: 10, top: 10 };
            }
        }

        function confirmText() {
            const text = document.getElementById('textInput').value;
            if (!text) {
                alert('Por favor, insira um texto antes de confirmar.');
                return;
            }
            const color = document.getElementById('textColor').value;
            const fontSize = document.getElementById('fontSize').value;
            const fontFamily = document.getElementById('fontFamily').value;
            const position = document.getElementById('position').value;

            const textElement = document.createElement('div');
            textElement.className = 'text-element';
            textElement.innerText = text;
            textElement.contentEditable = true;
            textElement.style.color = color;
            textElement.style.fontSize = `${fontSize}px`;
            textElement.style.fontFamily = fontFamily;

            textElement.style.position = 'absolute';
            textElement.style.visibility = 'hidden';
            document.body.appendChild(textElement);
            const elementWidth = textElement.offsetWidth;
            const elementHeight = textElement.offsetHeight;
            document.body.removeChild(textElement);
            textElement.style.visibility = 'visible';

            const { left, top } = getPositionCoordinates(position, elementWidth, elementHeight);
            textElement.style.left = `${left}px`;
            textElement.style.top = `${top}px`;

            makeDraggable(textElement);
            makeEditable(textElement);
            pages[currentPage].canvas.appendChild(textElement);
            pages[currentPage].elements.push(textElement);
            document.getElementById('textInput').value = '';
            selectedElement = textElement;
            textElement.classList.add('selected');
            textElement.focus();
            updateImageSizeSlider();
        }

        function confirmImage() {
            if (selectedElement && selectedElement.className.includes('image-container') && !selectedElement.classList.contains('confirmed')) {
                selectedElement.classList.add('confirmed');
                selectedElement.querySelector('.resize-handle')?.remove();
                selectedElement = null;
                updateImageSizeSlider();
                return;
            }

            const input = document.getElementById('imageInput');
            if (!input.files[0]) {
                alert('Por favor, selecione uma imagem antes de confirmar.');
                return;
            }
            const position = document.getElementById('position').value;

            const reader = new FileReader();
            reader.onload = function(e) {
                const container = document.createElement('div');
                container.className = 'image-container';
                const initialSize = 100;
                container.style.width = `${initialSize}px`;
                container.style.height = `${initialSize}px`;

                const { left, top } = getPositionCoordinates(position, initialSize, initialSize);
                container.style.left = `${left}px`;
                container.style.top = `${top}px`;

                const img = document.createElement('img');
                img.className = 'image-element';
                img.src = e.target.result;

                container.appendChild(img);
                makeDraggable(container);
                makeResizable(container);
                pages[currentPage].canvas.appendChild(container);
                pages[currentPage].elements.push(container);
                input.value = '';
                selectedElement = container;
                container.classList.add('selected');
                updateImageSizeSlider();
            };
            reader.readAsDataURL(input.files[0]);
        }

        function makeDraggable(element) {
            let isDragging = false;
            let currentX = 0;
            let currentY = 0;
            let initialX;
            let initialY;

            element.addEventListener('mousedown', (e) => {
                if (element.contentEditable === 'true' && document.activeElement === element) return;
                if (e.target.className.includes('resize-handle')) return;
                initialX = e.clientX - currentX;
                initialY = e.clientY - currentY;
                isDragging = true;
                selectedElement = element;
                document.querySelectorAll('.text-element, .image-container').forEach(el => el.classList.remove('selected'));
                element.classList.add('selected');
                updateImageSizeSlider();
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    currentX = Math.max(0, Math.min(currentX, canvasWidth - element.offsetWidth));
                    currentY = Math.max(0, Math.min(currentY, canvasHeight - element.offsetHeight));
                    element.style.left = `${currentX}px`;
                    element.style.top = `${currentY}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        function makeEditable(textElement) {
            textElement.addEventListener('click', (e) => {
                selectedElement = textElement;
                document.querySelectorAll('.text-element, .image-container').forEach(el => el.classList.remove('selected'));
                textElement.classList.add('selected');
                textElement.contentEditable = true;
                textElement.focus();
                updateImageSizeSlider();
                e.stopPropagation();
            });

            textElement.addEventListener('blur', () => {
                if (textElement.innerText.trim() === '') {
                    pages[currentPage].elements = pages[currentPage].elements.filter(el => el !== textElement);
                    textElement.remove();
                    selectedElement = null;
                }
                updateImageSizeSlider();
            });
        }

        function makeResizable(element) {
            let handle = element.querySelector('.resize-handle');
            if (!handle) {
                handle = document.createElement('div');
                handle.className = 'resize-handle';
                element.appendChild(handle);
            }

            let isResizing = false;
            let initialX, initialY, initialWidth, initialHeight;

            handle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isResizing = true;
                initialX = e.clientX;
                initialY = e.clientY;
                initialWidth = parseFloat(getComputedStyle(element).width);
                initialHeight = parseFloat(getComputedStyle(element).height);
            });

            document.addEventListener('mousemove', (e) => {
                if (isResizing) {
                    const newWidth = initialWidth + (e.clientX - initialX);
                    const newHeight = initialHeight + (e.clientY - initialY);
                    element.style.width = `${Math.max(50, Math.min(newWidth, canvasWidth))}px`;
                    element.style.height = `${Math.max(50, Math.min(newHeight, canvasHeight))}px`;
                    updateImageSizeSlider();
                }
            });

            document.addEventListener('mouseup', () => {
                isResizing = false;
            });
        }

        function updateImageSizeSlider() {
            if (selectedElement && selectedElement.className.includes('image-container')) {
                const width = parseFloat(getComputedStyle(selectedElement).width);
                document.getElementById('imageSize').value = Math.min(width, 595);
            } else {
                document.getElementById('imageSize').value = 100;
            }
        }

        function resizeSelectedImage() {
            if (selectedElement && selectedElement.className.includes('image-container')) {
                const newSize = document.getElementById('imageSize').value;
                selectedElement.style.width = `${newSize}px`;
                selectedElement.style.height = `${newSize}px`;
            }
        }

        function deleteImage() {
            if (selectedElement && selectedElement.className.includes('image-container')) {
                pages[currentPage].elements = pages[currentPage].elements.filter(el => el !== selectedElement);
                selectedElement.remove();
                selectedElement = null;
                updateImageSizeSlider();
            } else {
                alert('Por favor, selecione uma imagem para excluir.');
            }
        }

        function deleteText() {
            if (selectedElement && selectedElement.className.includes('text-element')) {
                pages[currentPage].elements = pages[currentPage].elements.filter(el => el !== selectedElement);
                selectedElement.remove();
                selectedElement = null;
                updateImageSizeSlider();
            } else {
                alert('Por favor, selecione um texto para excluir.');
            }
        }

        function addPage() {
            const newCanvas = document.createElement('div');
            newCanvas.id = `canvas-${pages.length}`;
            newCanvas.className = 'canvas';
            newCanvas.style.width = '595px';
            newCanvas.style.height = '842px';
            newCanvas.style.border = '1px dashed #000';
            newCanvas.style.position = 'relative';
            newCanvas.style.overflow = 'hidden';
            newCanvas.style.setProperty('--canvas-bg-color', confirmedBgColor);
            newCanvas.contentEditable = false;

            pages.push({ elements: [], canvas: newCanvas });
            switchPage(pages.length - 1);
        }

        function deletePage() {
            if (pages.length <= 1) {
                alert('Não é possível excluir a última página.');
                return;
            }

            pages[currentPage].canvas.remove();
            pages.splice(currentPage, 1);

            if (currentPage >= pages.length) {
                currentPage = pages.length - 1;
            }

            switchPage(currentPage);
        }

        function switchPage(pageIndex) {
            currentPage = pageIndex;
            const editor = document.querySelector('.editor');
            const currentCanvas = pages[currentPage].canvas;
            const oldCanvas = document.getElementById('canvas');
            if (oldCanvas) {
                oldCanvas.parentNode.replaceChild(currentCanvas, oldCanvas);
            } else {
                editor.appendChild(currentCanvas);
            }
            currentCanvas.id = 'canvas';
            currentCanvas.style.setProperty('--canvas-bg-color', confirmedBgColor);
            document.getElementById('page-indicator').innerText = `Página ${currentPage + 1}`;
            selectedElement = null;
            updateImageSizeSlider();
        }

        function prevPage() {
            if (currentPage > 0) switchPage(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < pages.length - 1) switchPage(currentPage + 1);
        }

        async function generatePDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                const pdfWidth = 210;
                const pdfHeight = 297;

                for (let i = 0; i < pages.length; i++) {
                    if (i > 0) doc.addPage();

                    doc.setFillColor(confirmedBgColor);
                    doc.rect(0, 0, pdfWidth, pdfHeight, 'F');

                    const canvas = pages[i].canvas.cloneNode(true);
                    canvas.classList.add('hidden-canvas');
                    canvas.style.setProperty('--canvas-bg-color', confirmedBgColor);
                    document.body.appendChild(canvas);

                    const images = canvas.querySelectorAll('.image-container');
                    images.forEach(img => {
                        img.style.border = 'none';
                        img.classList.remove('selected');
                    });

                    const textElements = canvas.querySelectorAll('.text-element');
                    textElements.forEach(text => {
                        text.contentEditable = false;
                        text.style.border = 'none';
                        text.classList.remove('selected');
                    });

                    await new Promise(resolve => setTimeout(resolve, 500));

                    const canvasImage = await html2canvas(canvas, {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        width: canvasWidth,
                        height: canvasHeight
                    });

                    canvas.remove();

                    const imgData = canvasImage.toDataURL('image/png');
                    doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                }

                doc.save('documento.pdf');
            } catch (error) {
                console.error('Erro ao gerar PDF:', error);
                alert('Ocorreu um erro ao gerar o PDF. Verifique o console para mais detalhes.');
            }
        }

        document.getElementById('canvas').addEventListener('click', (e) => {
            if (e.target === document.getElementById('canvas')) {
                document.querySelectorAll('.text-element, .image-container').forEach(el => {
                    if (el.className.includes('text-element')) el.blur();
                    el.classList.remove('selected');
                });
                selectedElement = null;
                updateImageSizeSlider();
            }
        });
    </script>
</body>
</html>
